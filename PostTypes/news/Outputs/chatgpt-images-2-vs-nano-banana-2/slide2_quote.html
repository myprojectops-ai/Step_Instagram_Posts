<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;font-family:'Inter',system-ui,sans-serif;overflow:hidden;position:relative;background:#000}
  .alta{position:absolute;top:44px;left:50px;height:100px;opacity:.98;z-index:10;filter:drop-shadow(0 2px 14px rgba(0,0,0,.55))}
  .card{position:absolute;top:186px;left:60px;right:60px;bottom:80px;background:#fff;border-radius:28px;padding:58px 58px;color:#0E0E0E;display:flex;flex-direction:column}
  .card-label{font-size:16px;font-weight:700;color:#E85D3C;text-transform:uppercase;letter-spacing:.14em}
  .card-body{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:40px 0 0 0}
  .quote-mark{font-family:'Inter',sans-serif;font-size:180px;font-weight:900;color:#E85D3C;line-height:.7;margin-bottom:14px}
  .quote{font-size:54px;font-weight:600;line-height:1.24;letter-spacing:-.01em;color:#0E0E0E}
  .quote .accent{background:#FFE45C;padding:0 8px 2px 8px;border-radius:4px}
  .attribution{padding-top:30px;border-top:2px solid #ECECEC;display:flex;align-items:center;gap:16px}
  .openai-logo{height:32px;width:auto;opacity:.95}
  .attribution-text{display:flex;flex-direction:column}
  .attribution-name{font-size:21px;font-weight:700;color:#0E0E0E;line-height:1.2}
  .attribution-meta{font-size:17px;font-weight:500;color:#6B6B6B;margin-top:4px}
</style></head>
<body>
  <img class="alta" src="../../../../Logos/Alta_Studio_logo_white.png">
  <div class="card">
    <div class="card-label">EL COMUNICADO OFICIAL</div>
    <div class="card-body">
      <div class="quote-mark">“</div>
      <div class="quote">Es nuestra primera modelo de imagen que <span class="accent">piensa antes de dibujar</span>: razona, busca contexto en la web y compone con un criterio visual más cercano al humano.</div>
    </div>
    <div class="attribution">
      <img class="openai-logo" src="../../../../Logos/OpenAI_logo.png">
      <div class="attribution-text">
        <div class="attribution-name">OpenAI</div>
        <div class="attribution-meta">Comunicado oficial · 21 abril 2026</div>
      </div>
    </div>
  </div>
</body></html>
