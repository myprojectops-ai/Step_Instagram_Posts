<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;font-family:'Inter',system-ui,sans-serif;overflow:hidden;position:relative;background:#000}
  .alta{position:absolute;top:44px;left:50px;height:100px;opacity:.98;z-index:10;filter:drop-shadow(0 2px 14px rgba(0,0,0,.55))}
  .card{position:absolute;top:186px;left:60px;right:60px;bottom:80px;background:#fff;border-radius:32px;padding:60px 58px 52px 58px;color:#0E0E0E;display:flex;flex-direction:column}
  .card-label{font-size:17px;font-weight:700;color:#E85D3C;text-transform:uppercase;letter-spacing:.14em}
  .stat-wrap{margin-top:40px;display:flex;align-items:baseline;gap:22px}
  .stat{font-size:260px;font-weight:900;line-height:.9;letter-spacing:-.05em;color:#0E0E0E}
  .stat-caption{font-size:26px;font-weight:700;line-height:1.2;color:#0E0E0E;text-transform:uppercase;letter-spacing:.02em;padding-bottom:30px;max-width:340px}
  .features{margin-top:56px;display:grid;grid-template-columns:1fr 1fr;gap:22px 26px}
  .feature{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:600;color:#0E0E0E;line-height:1.25}
  .feature::before{content:'';width:10px;height:10px;border-radius:50%;background:#E85D3C;flex-shrink:0}
  .availability{margin-top:56px;padding:24px 0;border-top:2px solid #ECECEC;border-bottom:2px solid #ECECEC;display:flex;align-items:center;justify-content:space-between}
  .availability-label{font-size:15px;font-weight:700;color:#8A8A8A;text-transform:uppercase;letter-spacing:.14em}
  .availability-items{display:flex;gap:20px;font-size:22px;font-weight:700;color:#0E0E0E}
  .availability-items .sep{color:#D0D0D0;font-weight:400}
  .punchline{margin-top:40px;font-size:28px;font-weight:600;line-height:1.32;color:#0E0E0E}
  .punchline .mark{background:#FFE45C;padding:0 8px 2px 8px;border-radius:4px}
  .source{margin-top:auto;padding-top:24px;font-size:16px;font-weight:500;color:#6B6B6B}
</style></head>
<body>
  <img class="alta" src="../../../../Logos/Alta_Studio_logo_white.png">
  <div class="card">
    <div class="card-label">LOS NÚMEROS</div>
    <div class="stat-wrap">
      <div class="stat">10</div>
      <div class="stat-caption">Imágenes generadas<br>desde un solo prompt</div>
    </div>
    <div class="features">
      <div class="feature">Hasta 2.000 px de ancho</div>
      <div class="feature">Razonamiento paso a paso</div>
      <div class="feature">Búsqueda web en tiempo real</div>
      <div class="feature">5 idiomas no latinos</div>
    </div>
    <div class="availability">
      <div class="availability-label">Disponible en</div>
      <div class="availability-items">
        <span>ChatGPT</span>
        <span class="sep">·</span>
        <span>Codex</span>
        <span class="sep">·</span>
        <span>API</span>
      </div>
    </div>
    <div class="punchline">Primera modelo de imagen con <span class="mark">capacidades de razonamiento</span>.</div>
    <div class="source">Fuente: OpenAI · 21 abr 2026</div>
  </div>
</body></html>
