<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;font-family:'Inter',system-ui,sans-serif;overflow:hidden;position:relative;background:#000;color:#fff}
  .alta{position:absolute;top:44px;left:50px;height:100px;opacity:.98;z-index:10;filter:drop-shadow(0 2px 14px rgba(0,0,0,.55))}
  .label{position:absolute;top:196px;left:60px;font-size:16px;font-weight:700;color:#E85D3C;text-transform:uppercase;letter-spacing:.14em;z-index:10}
  .text-block{position:absolute;top:252px;left:60px;right:60px;font-size:44px;font-weight:600;line-height:1.28;color:#fff;letter-spacing:-.008em;z-index:10}
  .text-block p{margin-bottom:28px}
  .text-block p:last-child{margin-bottom:0}
  .text-block .accent{color:#FFE45C}
  .text-block .coral{color:#E85D3C}
  .text-block strong{font-weight:700}
  .photo{position:absolute;bottom:0;left:0;right:0;height:608px;background-image:url('slide3_photo.png');background-size:cover;background-position:center center}
  .photo-fade-top{position:absolute;bottom:608px;left:0;right:0;height:36px;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 100%);pointer-events:none;z-index:4}
</style></head>
<body>
  <img class="alta" src="../../../../Logos/Alta_Studio_logo_white.png">
  <div class="label">LO QUE CAMBIA</div>
  <div class="text-block">
    <p>Por primera vez, un modelo de imagen <span class="accent">piensa antes de dibujar</span>.</p>
    <p>Razona, busca referencias en la web y valida su salida. Las imágenes se sienten menos <strong>"IA"</strong> y más <span class="coral">diseño humano</span>.</p>
  </div>
  <div class="photo-fade-top"></div>
  <div class="photo"></div>
</body></html>
