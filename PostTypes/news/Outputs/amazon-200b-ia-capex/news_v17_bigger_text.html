<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #FFFFFF;
    position: relative;
    background: #0A0A0A;
  }

  .photo-bg {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    object-fit: cover; object-position: center 10%;
    z-index: 0;
  }

  .overlay {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.03) 20%,
      rgba(0,0,0,0.40) 50%, rgba(0,0,0,0.92) 100%);
    z-index: 1;
  }
  .vignette {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: radial-gradient(ellipse 80% 75% at 40% 35%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.50) 100%);
    z-index: 1;
  }

  .content {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 50px 50px 50px;
  }

  .top-bar {
    display: flex; align-items: center;
    justify-content: space-between; width: 100%;
  }
  .left-group {
    display: flex; align-items: center; gap: 16px;
  }
  .badge {
    background: #E85D3C; color: #FFFFFF;
    font-size: 18px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.12em;
    padding: 10px 22px; border-radius: 8px;
  }
  .brand-logo {
    height: 30px; width: auto;
    opacity: 0.85;
  }
  .username {
    font-size: 22px; font-weight: 500;
    color: rgba(255,255,255,0.6);
  }

  .bottom-block {
    display: flex; flex-direction: column; gap: 18px;
  }
  .headline {
    font-size: 68px; font-weight: 800;
    line-height: 1.12; letter-spacing: -0.025em;
    max-width: 980px;
  }
  .accent-coral { color: #E85D3C; }
  .source {
    font-size: 18px; font-weight: 500;
    color: rgba(255,255,255,0.4);
  }
  .bottom-bar {
    display: flex; justify-content: flex-end;
    align-items: center; margin-top: 10px;
  }
  .watermark {
    width: 40px; height: auto;
    opacity: 0.4;
    filter: brightness(3) grayscale(0.3);
  }
</style>
</head>
<body>
  <img class="photo-bg" src="../../../../Assets/Personas/Andy_Jassy.jpg" alt="">
  <div class="overlay"></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="top-bar">
      <div class="left-group">
        <div class="badge">AI News</div>
        <img class="brand-logo" src="../../../../Logos/Amazon_logo_02.png" alt="Amazon">
      </div>
      <div class="username">@lucianomusellaa</div>
    </div>

    <div class="bottom-block">
      <h1 class="headline">
        Amazon revela sus primeras cifras de <span class="accent-coral">IA</span> y defiende su mega inversión
      </h1>
      <div class="source">Fuente: Carta anual de Andy Jassy a accionistas 2025</div>
      <div class="bottom-bar">
        <img class="watermark" src="../../../../Logos/Alta_Studio_Logo_fondoneutro.png" alt="Alta Studio">
      </div>
    </div>
  </div>
</body>
</html>
