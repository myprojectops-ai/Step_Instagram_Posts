<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #FFFFFF;
    position: relative;
    background: #0A0A0A;
  }

  .photo-bg {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    object-fit: cover; object-position: 35% 20%;
    z-index: 0;
  }

  /* HUGE $200B as a background watermark element */
  .big-number-bg {
    position: absolute;
    top: 8%; left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 280px;
    font-weight: 900;
    color: #FFFFFF;
    opacity: 0.06;
    letter-spacing: -0.04em;
    white-space: nowrap;
    z-index: 1;
    user-select: none;
  }

  /* Amazon logo */
  .brand-bg-icon {
    position: absolute;
    top: 15%; right: 40px;
    width: 420px; height: 420px;
    object-fit: contain;
    opacity: 0.15;
    filter: brightness(0) invert(1);
    mix-blend-mode: screen;
    z-index: 1;
  }

  .overlay {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.20) 0%, rgba(0,0,0,0.10) 25%,
      rgba(0,0,0,0.50) 55%, rgba(0,0,0,0.92) 100%);
    z-index: 2;
  }
  .vignette {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: radial-gradient(ellipse 80% 75% at 35% 30%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.50) 100%);
    z-index: 2;
  }

  .content {
    position: relative; z-index: 3;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 55px 60px 55px;
  }

  .top-bar {
    display: flex; align-items: center;
    justify-content: space-between; width: 100%;
  }
  .badge {
    background: #E85D3C; color: #FFFFFF;
    font-size: 18px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.12em;
    padding: 10px 22px; border-radius: 8px;
  }
  .username {
    font-size: 22px; font-weight: 500;
    color: rgba(255,255,255,0.6);
  }

  .bottom-block {
    display: flex; flex-direction: column; gap: 14px;
  }
  /* The hero number — massive, in-your-face */
  .hero-number {
    font-size: 130px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, #FF9900 0%, #FFD700 50%, #FF6600 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .headline {
    font-size: 46px; font-weight: 800;
    line-height: 1.15; letter-spacing: -0.02em;
    max-width: 940px;
  }
  .accent-orange { color: #FF9900; }
  .source {
    font-size: 18px; font-weight: 500;
    color: rgba(255,255,255,0.4);
  }
  .bottom-bar {
    display: flex; justify-content: flex-end;
    align-items: center; margin-top: 10px;
  }
  .watermark {
    width: 40px; height: auto;
    opacity: 0.4;
    filter: brightness(3) grayscale(0.3);
  }
</style>
</head>
<body>
  <img class="photo-bg" src="../../../../Assets/Personas/Andy_Jassy_Amazon.webp" alt="">
  <div class="big-number-bg">$200B</div>
  <img class="brand-bg-icon" src="../../../../Logos/Amazon_logo.png" alt="">
  <div class="overlay"></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="top-bar">
      <div class="badge">AI News</div>
      <div class="username">@lucianomusellaa</div>
    </div>

    <div class="bottom-block">
      <div class="hero-number">$200B</div>
      <h1 class="headline">
        La apuesta de Amazon en IA que nadie se atreve a hacer
      </h1>
      <div class="source">Fuente: Carta anual de Andy Jassy a accionistas</div>
      <div class="bottom-bar">
        <img class="watermark" src="../../../../Logos/Alta_Studio_Logo_fondoneutro.png" alt="Alta Studio">
      </div>
    </div>
  </div>
</body>
</html>
