<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #FFFFFF;
    position: relative;
    background: #0A0A0A;
  }

  .photo-bg {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    object-fit: cover; object-position: center 10%;
    z-index: 0;
  }

  .brand-bg {
    position: absolute;
    top: 16%; left: 50%;
    transform: translateX(-50%);
    width: 580px; height: auto;
    opacity: 0.16;
    mix-blend-mode: screen;
    z-index: 1;
  }

  .overlay {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.05) 20%,
      rgba(0,0,0,0.50) 55%, rgba(0,5,0,0.93) 100%);
    z-index: 2;
  }
  .vignette {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: radial-gradient(ellipse 75% 70% at 45% 30%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%);
    z-index: 2;
  }
  /* Green money glow */
  .glow-green {
    position: absolute; bottom: 0; left: 0;
    width: 1080px; height: 600px;
    background: radial-gradient(ellipse 100% 100% at 30% 100%,
      rgba(50,200,80,0.12) 0%, transparent 55%);
    z-index: 2;
  }

  .content {
    position: relative; z-index: 3;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 55px 60px 55px;
  }

  .top-bar {
    display: flex; align-items: center;
    justify-content: space-between; width: 100%;
  }
  .badge {
    background: #22C55E; color: #000000;
    font-size: 18px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.12em;
    padding: 10px 22px; border-radius: 8px;
  }
  .username {
    font-size: 22px; font-weight: 500;
    color: rgba(255,255,255,0.6);
  }

  .bottom-block {
    display: flex; flex-direction: column; gap: 10px;
  }
  .hero-number {
    font-size: 140px;
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.05em;
    background: linear-gradient(135deg, #22C55E 0%, #86EFAC 35%, #FCD34D 70%, #F59E0B 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero-label {
    font-size: 26px; font-weight: 700;
    color: rgba(255,255,255,0.50);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: -4px;
  }
  .headline {
    font-size: 48px; font-weight: 800;
    line-height: 1.15; letter-spacing: -0.02em;
    max-width: 940px;
    margin-top: 10px;
  }
  .accent-green { color: #4ADE80; }
  .source {
    font-size: 18px; font-weight: 500;
    color: rgba(255,255,255,0.4);
    margin-top: 6px;
  }
  .bottom-bar {
    display: flex; justify-content: flex-end;
    align-items: center; margin-top: 10px;
  }
  .watermark {
    width: 40px; height: auto;
    opacity: 0.4;
    filter: brightness(3) grayscale(0.3);
  }
</style>
</head>
<body>
  <img class="photo-bg" src="../../../../Assets/Personas/Andy_Jassy.jpg" alt="">
  <img class="brand-bg" src="../../../../Logos/Amazon_logo_02.png" alt="">
  <div class="overlay"></div>
  <div class="vignette"></div>
  <div class="glow-green"></div>

  <div class="content">
    <div class="top-bar">
      <div class="badge">AI News</div>
      <div class="username">@lucianomusellaa</div>
    </div>

    <div class="bottom-block">
      <div class="hero-number">$200B</div>
      <div class="hero-label">la apuesta más grande en IA</div>
      <h1 class="headline">
        Amazon no piensa ser <span class="accent-green">conservador</span> con la inteligencia artificial
      </h1>
      <div class="source">Fuente: Carta anual de Andy Jassy a accionistas</div>
      <div class="bottom-bar">
        <img class="watermark" src="../../../../Logos/Alta_Studio_Logo_fondoneutro.png" alt="Alta Studio">
      </div>
    </div>
  </div>
</body>
</html>
