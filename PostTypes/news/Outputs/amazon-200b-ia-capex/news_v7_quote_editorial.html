<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #FFFFFF;
    position: relative;
    background: #0A0A0A;
  }

  .photo-bg {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    object-fit: cover; object-position: center 10%;
    z-index: 0;
  }

  /* Amazon wordmark — large, right side */
  .brand-bg {
    position: absolute;
    top: 12%; right: -40px;
    width: 520px; height: auto;
    opacity: 0.20;
    mix-blend-mode: screen;
    z-index: 1;
  }

  .overlay {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.02) 20%,
      rgba(0,0,0,0.45) 52%, rgba(0,0,0,0.94) 100%);
    z-index: 2;
  }
  .vignette {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: radial-gradient(ellipse 75% 70% at 40% 28%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%);
    z-index: 2;
  }
  .glow-bottom {
    position: absolute; bottom: 0; left: 0;
    width: 1080px; height: 600px;
    background: radial-gradient(ellipse 100% 100% at 50% 100%,
      rgba(255,153,0,0.14) 0%, transparent 55%);
    z-index: 2;
  }

  /* Bold left accent bar */
  .left-accent {
    position: absolute;
    left: 0; top: 0;
    width: 7px; height: 1350px;
    background: linear-gradient(to bottom, transparent 0%, #FF9900 35%, #E85D3C 65%, transparent 100%);
    z-index: 4;
  }

  .content {
    position: relative; z-index: 3;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 55px 60px 55px;
  }

  .top-bar {
    display: flex; align-items: center;
    justify-content: space-between; width: 100%;
  }
  .badge {
    background: #FF9900; color: #000000;
    font-size: 18px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.12em;
    padding: 10px 22px; border-radius: 8px;
  }
  .username {
    font-size: 22px; font-weight: 500;
    color: rgba(255,255,255,0.6);
  }

  .bottom-block {
    display: flex; flex-direction: column; gap: 14px;
  }
  .quote-block {
    border-left: 5px solid #FF9900;
    padding-left: 22px;
    margin-bottom: 6px;
  }
  .quote-text {
    font-size: 26px; font-weight: 600;
    font-style: italic;
    color: rgba(255,210,120,0.9);
    line-height: 1.35;
    max-width: 800px;
  }
  .quote-author {
    font-size: 18px; font-weight: 600;
    color: rgba(255,255,255,0.5);
    margin-top: 8px;
  }
  .headline {
    font-size: 54px; font-weight: 800;
    line-height: 1.15; letter-spacing: -0.02em;
    max-width: 940px;
  }
  .accent-orange { color: #FF9900; }
  .source {
    font-size: 18px; font-weight: 500;
    color: rgba(255,255,255,0.4);
  }
  .bottom-bar {
    display: flex; justify-content: flex-end;
    align-items: center; margin-top: 10px;
  }
  .watermark {
    width: 40px; height: auto;
    opacity: 0.4;
    filter: brightness(3) grayscale(0.3);
  }
</style>
</head>
<body>
  <img class="photo-bg" src="../../../../Assets/Personas/Andy_Jassy.jpg" alt="">
  <img class="brand-bg" src="../../../../Logos/Amazon_logo_02.png" alt="">
  <div class="overlay"></div>
  <div class="vignette"></div>
  <div class="glow-bottom"></div>
  <div class="left-accent"></div>

  <div class="content">
    <div class="top-bar">
      <div class="badge">AI News</div>
      <div class="username">@lucianomusellaa</div>
    </div>

    <div class="bottom-block">
      <div class="quote-block">
        <div class="quote-text">"No estamos invirtiendo $200,000M en una corazonada. No vamos a ser conservadores."</div>
        <div class="quote-author">— Andy Jassy, CEO de Amazon</div>
      </div>
      <h1 class="headline">
        Amazon defiende la mayor apuesta en <span class="accent-orange">IA</span> de la historia
      </h1>
      <div class="source">Fuente: Carta anual a accionistas 2025</div>
      <div class="bottom-bar">
        <img class="watermark" src="../../../../Logos/Alta_Studio_Logo_fondoneutro.png" alt="Alta Studio">
      </div>
    </div>
  </div>
</body>
</html>
