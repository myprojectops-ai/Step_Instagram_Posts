<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #FFFFFF;
    position: relative;
    background: #0A0A0A;
  }

  .photo-bg {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    object-fit: cover; object-position: 35% 20%;
    z-index: 0;
  }

  .brand-bg-icon {
    position: absolute;
    top: 8%; right: -10px;
    width: 520px; height: 520px;
    object-fit: contain;
    opacity: 0.22;
    filter: brightness(0) invert(1);
    mix-blend-mode: screen;
    z-index: 1;
  }

  /* Dual-tone overlay: blue from the photo's stage lighting + warm orange from bottom */
  .overlay-blue {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: linear-gradient(160deg,
      rgba(0,30,80,0.30) 0%,
      rgba(0,10,40,0.15) 40%,
      transparent 60%);
    z-index: 2;
  }
  .overlay-dark {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.05) 25%,
      rgba(0,0,0,0.45) 55%, rgba(0,0,0,0.90) 100%);
    z-index: 2;
  }
  .overlay-warm {
    position: absolute; bottom: 0; left: 0;
    width: 1080px; height: 700px;
    background: radial-gradient(ellipse 120% 100% at 50% 100%,
      rgba(255,120,0,0.14) 0%, transparent 65%);
    z-index: 2;
  }
  .vignette {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: radial-gradient(ellipse 75% 70% at 35% 30%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%);
    z-index: 2;
  }

  .content {
    position: relative; z-index: 3;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 55px 60px 55px;
  }

  .top-bar {
    display: flex; align-items: center;
    justify-content: space-between; width: 100%;
  }
  .badge {
    background: #E85D3C; color: #FFFFFF;
    font-size: 18px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.12em;
    padding: 10px 22px; border-radius: 8px;
  }
  .username {
    font-size: 22px; font-weight: 500;
    color: rgba(255,255,255,0.6);
  }

  .bottom-block {
    display: flex; flex-direction: column; gap: 12px;
  }
  /* Quote callout — adds personality and clickbait energy */
  .quote-callout {
    font-size: 24px; font-weight: 600;
    font-style: italic;
    color: rgba(255,200,100,0.85);
    border-left: 4px solid #FF9900;
    padding-left: 18px;
    margin-bottom: 8px;
    max-width: 800px;
    line-height: 1.35;
  }
  .headline {
    font-size: 55px; font-weight: 800;
    line-height: 1.15; letter-spacing: -0.02em;
    max-width: 940px;
  }
  .accent-orange { color: #FF9900; }
  .source {
    font-size: 18px; font-weight: 500;
    color: rgba(255,255,255,0.4);
  }
  .bottom-bar {
    display: flex; justify-content: flex-end;
    align-items: center; margin-top: 10px;
  }
  .watermark {
    width: 40px; height: auto;
    opacity: 0.4;
    filter: brightness(3) grayscale(0.3);
  }
</style>
</head>
<body>
  <img class="photo-bg" src="../../../../Assets/Personas/Andy_Jassy_Amazon.webp" alt="">
  <img class="brand-bg-icon" src="../../../../Logos/Amazon_logo.png" alt="">
  <div class="overlay-blue"></div>
  <div class="overlay-dark"></div>
  <div class="overlay-warm"></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="top-bar">
      <div class="badge">AI News</div>
      <div class="username">@lucianomusellaa</div>
    </div>

    <div class="bottom-block">
      <div class="quote-callout">"No estamos invirtiendo $200,000M en una corazonada."</div>
      <h1 class="headline">
        Amazon defiende su apuesta de <span class="accent-orange">$200,000M</span> en inteligencia artificial
      </h1>
      <div class="source">Fuente: Carta anual de Andy Jassy a accionistas</div>
      <div class="bottom-bar">
        <img class="watermark" src="../../../../Logos/Alta_Studio_Logo_fondoneutro.png" alt="Alta Studio">
      </div>
    </div>
  </div>
</body>
</html>
