<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #FFFFFF;
    position: relative;
    background: #0A0A0A;
  }

  .photo-bg {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    object-fit: cover; object-position: 35% 20%;
    z-index: 0;
  }

  .brand-bg-icon {
    position: absolute;
    top: 10%; right: -30px;
    width: 480px; height: 480px;
    object-fit: contain;
    opacity: 0.20;
    filter: brightness(0) invert(1);
    mix-blend-mode: screen;
    z-index: 1;
  }

  .overlay {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.05) 25%,
      rgba(0,0,0,0.50) 58%, rgba(0,0,0,0.90) 100%);
    z-index: 2;
  }
  .vignette {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: radial-gradient(ellipse 80% 75% at 35% 30%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.50) 100%);
    z-index: 2;
  }

  /* Bold diagonal orange accent strip */
  .accent-strip {
    position: absolute;
    bottom: 340px; left: 0;
    width: 1080px; height: 6px;
    background: linear-gradient(90deg, #FF9900 0%, #E85D3C 60%, transparent 100%);
    z-index: 3;
  }

  /* Vertical accent bar left edge */
  .left-bar {
    position: absolute;
    top: 0; left: 0;
    width: 6px; height: 1350px;
    background: linear-gradient(to bottom, transparent 0%, #FF9900 40%, #E85D3C 70%, transparent 100%);
    z-index: 3;
  }

  .content {
    position: relative; z-index: 4;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 55px 60px 55px;
  }

  .top-bar {
    display: flex; align-items: center;
    justify-content: space-between; width: 100%;
  }
  .badge {
    background: #FF9900; color: #000000;
    font-size: 18px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.12em;
    padding: 10px 22px; border-radius: 8px;
  }
  .username {
    font-size: 22px; font-weight: 500;
    color: rgba(255,255,255,0.6);
  }

  .bottom-block {
    display: flex; flex-direction: column; gap: 16px;
  }
  .stat-row {
    display: flex; gap: 20px; align-items: center;
  }
  .stat-pill {
    background: rgba(255,153,0,0.15);
    border: 1px solid rgba(255,153,0,0.35);
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 16px; font-weight: 700;
    color: #FF9900;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .headline {
    font-size: 54px; font-weight: 800;
    line-height: 1.15; letter-spacing: -0.02em;
    max-width: 940px;
  }
  .accent-orange { color: #FF9900; }
  .source {
    font-size: 18px; font-weight: 500;
    color: rgba(255,255,255,0.4);
  }
  .bottom-bar {
    display: flex; justify-content: flex-end;
    align-items: center; margin-top: 10px;
  }
  .watermark {
    width: 40px; height: auto;
    opacity: 0.4;
    filter: brightness(3) grayscale(0.3);
  }
</style>
</head>
<body>
  <img class="photo-bg" src="../../../../Assets/Personas/Andy_Jassy_Amazon.webp" alt="">
  <img class="brand-bg-icon" src="../../../../Logos/Amazon_logo.png" alt="">
  <div class="overlay"></div>
  <div class="vignette"></div>
  <div class="accent-strip"></div>
  <div class="left-bar"></div>

  <div class="content">
    <div class="top-bar">
      <div class="badge">AI News</div>
      <div class="username">@lucianomusellaa</div>
    </div>

    <div class="bottom-block">
      <div class="stat-row">
        <div class="stat-pill">$200B CAPEX</div>
        <div class="stat-pill">AWS IA: $15B</div>
        <div class="stat-pill">CHIPS: $50B</div>
      </div>
      <h1 class="headline">
        El CEO de Amazon defiende la mayor apuesta en <span class="accent-orange">IA</span> de la historia
      </h1>
      <div class="source">Fuente: Carta anual de Andy Jassy a accionistas</div>
      <div class="bottom-bar">
        <img class="watermark" src="../../../../Logos/Alta_Studio_Logo_fondoneutro.png" alt="Alta Studio">
      </div>
    </div>
  </div>
</body>
</html>
