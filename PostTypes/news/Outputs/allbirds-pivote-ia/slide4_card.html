<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;font-family:'Inter',system-ui,sans-serif;overflow:hidden;position:relative;background:#000}
  .alta{position:absolute;top:44px;left:50px;height:100px;opacity:.98;z-index:10;filter:drop-shadow(0 2px 14px rgba(0,0,0,.55))}
  .card{position:absolute;top:170px;left:60px;right:60px;bottom:110px;background:#fff;border-radius:28px;padding:52px 54px;color:#0E0E0E;display:flex;flex-direction:column;justify-content:space-between}
  .card-label{font-size:15px;font-weight:700;color:#E85D3C;text-transform:uppercase;letter-spacing:.14em}
  .stat-wrap{margin-top:20px;margin-bottom:18px}
  .stat{font-size:240px;font-weight:900;line-height:.92;letter-spacing:-.05em;color:#0E0E0E;display:flex;align-items:flex-start}
  .stat .plus{font-size:120px;font-weight:900;line-height:1.1;margin-right:4px;color:#E85D3C}
  .stat-body{font-size:34px;font-weight:600;line-height:1.28;letter-spacing:-.01em;color:#0E0E0E;margin-top:6px;max-width:92%}
  .stat-body .hl{background:#FFE45C;padding:0 6px;border-radius:4px}
  .source-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:30px;padding-top:26px;border-top:2px solid #ECECEC}
  .source{font-size:17px;font-weight:500;color:#6B6B6B}
  .value-add{font-size:17px;font-weight:700;color:#0E0E0E}
  .dots{position:absolute;bottom:44px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:20}
  .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.45)}
  .dot.active{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.7)}
</style></head>
<body>
  <img class="alta" src="../../../../Logos/Alta_Studio_logo_white.png">
  <div class="card">
    <div class="card-label">LA REACCIÓN DEL MERCADO</div>
    <div class="stat-wrap">
      <div class="stat"><span class="plus">+</span>582%</div>
      <div class="stat-body">subió la acción de Allbirds <span class="hl">en un solo día</span>, después de mencionar IA en su anuncio.</div>
    </div>
    <div class="source-row">
      <div class="source">Fuente: CNBC</div>
      <div class="value-add">US$127M de valor agregado</div>
    </div>
  </div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot active"></div>
    <div class="dot"></div>
  </div>
</body></html>
