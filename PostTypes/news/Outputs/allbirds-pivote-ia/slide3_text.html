<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;font-family:'Inter',system-ui,sans-serif;overflow:hidden;position:relative;background:#000;color:#fff}
  .alta{position:absolute;top:44px;left:50px;height:100px;opacity:.98;z-index:10;filter:drop-shadow(0 2px 14px rgba(0,0,0,.55))}
  .label{position:absolute;top:184px;left:60px;font-size:15px;font-weight:700;color:#E85D3C;text-transform:uppercase;letter-spacing:.14em;z-index:10}
  .text-block{position:absolute;top:240px;left:60px;right:60px;font-size:38px;font-weight:600;line-height:1.28;color:#fff;letter-spacing:-.008em;z-index:10}
  .text-block p{margin-bottom:22px}
  .text-block p:last-child{margin-bottom:0}
  .text-block .accent{color:#FFE45C}
  .text-block strong{font-weight:700}
  .photo{position:absolute;bottom:0;left:0;right:0;height:608px;background-image:url('slide3_photo.png');background-size:cover;background-position:center center}
  .photo-fade-top{position:absolute;bottom:608px;left:0;right:0;height:30px;background:linear-gradient(to top,rgba(0,0,0,.5) 0%,transparent 100%);pointer-events:none;z-index:4}
  .dots{position:absolute;bottom:32px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:20}
  .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 1px 4px rgba(0,0,0,.6)}
  .dot.active{background:#fff;box-shadow:0 0 12px rgba(255,255,255,.9)}
</style></head>
<body>
  <img class="alta" src="../../../../Logos/Alta_Studio_logo_white.png">
  <div class="label">EL PIVOTE</div>
  <div class="text-block">
    <p>Allbirds venderá su marca y activos de calzado a <strong>American Exchange Group</strong> por <span class="accent">US$39M</span>.</p>
    <p>Con <span class="accent">US$50M</span> de financiamiento convertible, comprarán GPUs de alta gama.</p>
    <p>Se rebautizan como <strong>NewBird AI</strong> — un proveedor de "GPU-as-a-Service".</p>
  </div>
  <div class="photo"></div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body></html>
