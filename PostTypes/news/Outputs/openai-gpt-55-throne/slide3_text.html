<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;font-family:'Inter',system-ui,sans-serif;overflow:hidden;position:relative;background:#000;color:#fff}
  .alta{position:absolute;top:44px;left:50px;height:100px;opacity:.98;z-index:10;filter:drop-shadow(0 2px 14px rgba(0,0,0,.55))}
  .label{position:absolute;top:196px;left:60px;font-size:16px;font-weight:750;color:#E85D3C;text-transform:uppercase;letter-spacing:.14em;z-index:10}
  .text-block{position:absolute;top:252px;left:60px;right:60px;font-size:43px;font-weight:650;line-height:1.28;color:#fff;letter-spacing:-.009em;z-index:10}
  .text-block p{margin-bottom:28px}
  .accent{color:#FFE45C;font-weight:800}
  .coral{color:#E85D3C;font-weight:800}
  .photo{position:absolute;bottom:0;left:0;right:0;height:608px;background-image:url('slide3_photo.png');background-size:cover;background-position:center center}
  .photo-fade-top{position:absolute;bottom:608px;left:0;right:0;height:44px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);pointer-events:none;z-index:4}
</style></head>
<body>
  <img class="alta" src="../../../../Logos/Alta_Studio_logo_white.png">
  <div class="label">LO QUE CAMBIA</div>
  <div class="text-block">
    <p>GPT-5.5 está diseñado para tareas largas: <span class="accent">código</span>, investigación, datos, documentos, hojas de cálculo y software.</p>
    <p>La promesa es menos microgestión: le das una tarea desordenada y el modelo planea, usa herramientas y verifica su propio trabajo.</p>
  </div>
  <div class="photo-fade-top"></div>
  <div class="photo"></div>
</body></html>
