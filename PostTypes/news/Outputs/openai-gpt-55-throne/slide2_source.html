<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;font-family:'Inter',system-ui,sans-serif;overflow:hidden;position:relative;background:#000;color:#fff}
  .alta{position:absolute;top:44px;left:50px;height:100px;opacity:.98;z-index:10;filter:drop-shadow(0 2px 14px rgba(0,0,0,.55))}
  .wrap{position:absolute;top:178px;left:60px;right:60px;bottom:92px;display:flex;flex-direction:column;justify-content:space-between}
  .label{font-size:16px;font-weight:750;color:#E85D3C;text-transform:uppercase;letter-spacing:.14em}
  .source-card{background:#fff;color:#0E0E0E;border-radius:28px;padding:48px 50px 44px;box-shadow:0 18px 60px rgba(255,255,255,.08)}
  .source-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px;border-bottom:1px solid #E8EAED;padding-bottom:24px}
  .brand{font-size:31px;font-weight:850;letter-spacing:-.02em}
  .date{font-size:18px;font-weight:650;color:#6B7280;text-transform:uppercase;letter-spacing:.08em}
  .quote-mark{font-size:126px;font-weight:900;color:#E85D3C;line-height:.65;margin-bottom:18px}
  .quote{font-size:45px;font-weight:750;line-height:1.18;letter-spacing:-.018em}
  .quote .yellow{background:#FFE45C;padding:0 8px 4px;border-radius:6px}
  .meta{margin-top:34px;font-size:21px;font-weight:650;color:#6B7280;line-height:1.35}
  .reading{text-align:center;padding:0 20px}
  .line{width:48px;height:2px;background:#E85D3C;margin:0 auto 22px}
  .reading-label{font-size:15px;font-weight:750;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.2em;margin-bottom:20px}
  .reading-text{font-size:35px;font-weight:750;line-height:1.25;letter-spacing:-.01em}
  .reading-text .coral{color:#E85D3C}
</style></head>
<body>
  <img class="alta" src="../../../../Logos/Alta_Studio_logo_white.png">
  <div class="wrap">
    <div class="label">LA FUENTE OFICIAL</div>
    <div class="source-card">
      <div class="source-top">
        <div class="brand">OpenAI · GPT-5.5</div>
        <div class="date">23 ABR 2026</div>
      </div>
      <div class="quote-mark">"</div>
      <div class="quote">OpenAI lo llama su modelo <span class="yellow">más inteligente</span> e intuitivo hasta ahora.</div>
      <div class="meta">Ya se está desplegando en ChatGPT y Codex para Plus, Pro, Business y Enterprise.</div>
    </div>
    <div class="reading">
      <div class="line"></div>
      <div class="reading-label">LA LECTURA</div>
      <div class="reading-text">La pelea ya no es solo chat: es quién resuelve <span class="coral">trabajo completo</span>.</div>
    </div>
  </div>
</body></html>
