<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;font-family:'Inter',system-ui,sans-serif;overflow:hidden;position:relative;background:#000}
  .photo{position:absolute;top:0;left:0;right:0;bottom:0;background-image:url('composition_fullbleed.png');background-size:cover;background-position:center center}
  .gradient{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.88) 8%, rgba(0,0,0,0.72) 22%, rgba(0,0,0,0.35) 42%, transparent 62%);z-index:2}
  .alta{position:absolute;top:44px;left:50px;height:100px;opacity:.98;z-index:10;filter:drop-shadow(0 2px 14px rgba(0,0,0,.55))}
  .headline{position:absolute;top:860px;left:60px;right:60px;font-size:64px;font-weight:800;line-height:1.1;color:#fff;letter-spacing:-.012em;text-transform:uppercase;text-shadow:0 2px 20px rgba(0,0,0,.6);z-index:10}
  .headline .coral{color:#E85D3C}
  .headline .yellow{background:#FFE45C;color:#0E0E0E;padding:0 12px 5px 12px;border-radius:6px;display:inline-block;line-height:1}
  .bottom-row{position:absolute;top:1268px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;gap:24px;z-index:10}
  .tagline{font-size:14px;font-weight:600;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.1em;line-height:1.4;flex:1;text-shadow:0 1px 8px rgba(0,0,0,.5)}
  .swipe{background:#fff;padding:13px 24px;border-radius:999px;color:#0E0E0E;font-size:14px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.55)}
</style></head>
<body>
  <div class="photo"></div>
  <div class="gradient"></div>
  <img class="alta" src="../../../../Logos/Alta_Studio_logo_white.png">
  <div class="headline">
    <span class="coral">OPENAI</span> ENCERRÓ A SUS<br>
    AGENTES EN UNA <span class="yellow">SANDBOX</span><br>
    PARA PROTEGER TUS<br>
    CREDENCIALES
  </div>
  <div class="bottom-row">
    <div class="tagline">EL UPDATE QUE LLEVA A LOS AGENTES DE IA A PRODUCCIÓN EMPRESARIAL</div>
    <div class="swipe">DESLIZA →</div>
  </div>
</body></html>
