<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;font-family:'Inter',system-ui,sans-serif;overflow:hidden;position:relative;background:#000;color:#fff}
  .alta{position:absolute;top:44px;left:50px;height:100px;opacity:.98;z-index:10;filter:drop-shadow(0 2px 14px rgba(0,0,0,.55))}
  .label{position:absolute;top:208px;left:60px;font-size:16px;font-weight:700;color:#E85D3C;text-transform:uppercase;letter-spacing:.14em;z-index:10}
  .quote-wrap{position:absolute;top:290px;left:60px;right:60px;z-index:10}
  .quote-mark{font-family:'Inter',sans-serif;font-size:180px;font-weight:900;line-height:.7;color:#E85D3C;margin-bottom:14px;height:90px;display:block}
  .quote{font-size:44px;font-weight:600;line-height:1.32;color:#fff;letter-spacing:-.01em}
  .quote .accent{color:#FFE45C}
  .attribution{margin-top:50px;padding-top:26px;border-top:2px solid rgba(255,255,255,.18)}
  .person{font-size:26px;font-weight:800;color:#fff;letter-spacing:.01em}
  .role{font-size:20px;font-weight:500;color:rgba(255,255,255,.65);margin-top:6px;letter-spacing:.02em}
  .takeaway-block{position:absolute;bottom:130px;left:60px;right:60px;text-align:center;z-index:10}
  .takeaway-line{display:inline-block;width:48px;height:2px;background:#E85D3C;margin-bottom:18px}
  .takeaway-label{font-size:15px;font-weight:700;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.18em}
  .takeaway{margin-top:16px;font-size:30px;font-weight:700;line-height:1.3;color:#fff}
  .takeaway .accent{color:#E85D3C}
</style></head>
<body>
  <img class="alta" src="../../../../Logos/Alta_Studio_logo_white.png">
  <div class="label">LA VOZ EMPRESARIAL</div>
  <div class="quote-wrap">
    <span class="quote-mark">“</span>
    <div class="quote">Este update hizo que por fin fuera <span class="accent">viable</span> automatizar un flujo crítico de registros clínicos que antes no era lo suficientemente confiable.</div>
    <div class="attribution">
      <div class="person">Rachael Burns</div>
      <div class="role">Staff Engineer · Oscar Health</div>
    </div>
  </div>
  <div class="takeaway-block">
    <span class="takeaway-line"></span>
    <div class="takeaway-label">LA LECTURA</div>
    <div class="takeaway">Los agentes de IA dejan de ser demo y pasan a <span class="accent">producción empresarial</span>.</div>
  </div>
</body></html>
