<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;font-family:'Inter',system-ui,sans-serif;overflow:hidden;position:relative;background:#000}
  .alta{position:absolute;top:44px;left:50px;height:100px;opacity:.98;z-index:10;filter:drop-shadow(0 2px 14px rgba(0,0,0,.55))}
  .card{position:absolute;top:186px;left:60px;right:60px;bottom:100px;background:#fff;border-radius:32px;padding:64px 60px 58px 60px;color:#0E0E0E;display:flex;flex-direction:column}
  .card-label{font-size:17px;font-weight:700;color:#E85D3C;text-transform:uppercase;letter-spacing:.14em}
  .stat-wrap{margin-top:34px;display:flex;align-items:baseline;gap:22px}
  .stat{font-size:260px;font-weight:900;line-height:.9;letter-spacing:-.05em;color:#0E0E0E}
  .stat-caption{font-size:26px;font-weight:700;line-height:1.2;color:#0E0E0E;text-transform:uppercase;letter-spacing:.02em;padding-bottom:30px;max-width:330px}
  .providers{margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:16px 26px}
  .provider{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:600;color:#0E0E0E}
  .provider::before{content:'';width:10px;height:10px;border-radius:50%;background:#E85D3C;flex-shrink:0}
  .punchline{margin-top:auto;font-size:26px;font-weight:600;line-height:1.32;color:#0E0E0E}
  .punchline .mark{background:#FFE45C;padding:0 8px 2px 8px;border-radius:4px}
  .source{margin-top:18px;font-size:16px;font-weight:500;color:#6B6B6B}
</style></head>
<body>
  <img class="alta" src="../../../../Logos/Alta_Studio_logo_white.png">
  <div class="card">
    <div class="card-label">LOS PROVEEDORES</div>
    <div class="stat-wrap">
      <div class="stat">7</div>
      <div class="stat-caption">Sandboxes con soporte nativo desde el día uno</div>
    </div>
    <div class="providers">
      <div class="provider">Blaxel</div>
      <div class="provider">Cloudflare</div>
      <div class="provider">Daytona</div>
      <div class="provider">E2B</div>
      <div class="provider">Modal</div>
      <div class="provider">Runloop</div>
      <div class="provider">Vercel</div>
      <div class="provider" style="opacity:.35">+ los tuyos</div>
    </div>
    <div class="punchline">El modelo ejecuta código sin ver <span class="mark">ni una sola credencial</span> de tu stack.</div>
    <div class="source">Fuente: OpenAI · 15 abr 2026</div>
  </div>
</body></html>
