<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #FFFFFF;
    position: relative;
  }

  .photo-bg {
    position: absolute;
    top: 0; left: 0;
    width: 1080px; height: 1350px;
    object-fit: cover;
    object-position: center 20%;
    z-index: 0;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.05) 0%,
      rgba(0, 0, 0, 0.05) 30%,
      rgba(0, 0, 0, 0.50) 60%,
      rgba(0, 0, 0, 0.85) 100%
    );
    z-index: 1;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 55px 60px 55px;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }
  .badge {
    background: #E85D3C;
    color: #FFFFFF;
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    padding: 10px 22px;
    border-radius: 8px;
  }
  .username {
    font-size: 22px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.6);
  }

  .bottom-block {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .headline {
    font-size: 58px;
    font-weight: 800;
    line-height: 1.18;
    letter-spacing: -0.02em;
    max-width: 940px;
  }
  .accent-coral { color: #E85D3C; }
  .source {
    font-size: 19px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.45);
  }
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }
  .perplexity-wordmark {
    height: 26px;
    width: auto;
    filter: brightness(0) invert(1);
    opacity: 0.5;
  }
  .watermark {
    width: 40px;
    height: auto;
    opacity: 0.4;
    filter: brightness(3) grayscale(0.3);
  }
</style>
</head>
<body>
  <img class="photo-bg" src="../../../../Assets/Personas/aravind_srinivas_perplexity_02.webp" alt="">
  <div class="overlay"></div>

  <div class="content">
    <div class="top-bar">
      <div class="badge">AI News</div>
      <div class="username">@lucianomusellaa</div>
    </div>

    <div class="bottom-block">
      <h1 class="headline">
        Perplexity ofrece <span class="accent-coral">$1M</span> a quien construya un unicornio en 8 semanas
      </h1>
      <div class="source">Fuente: Superhuman AI</div>
      <div class="bottom-bar">
        <img class="perplexity-wordmark" src="../../../../Logos/Perplexity_logo_02.png" alt="Perplexity">
        <img class="watermark" src="../../../../Logos/Alta_Studio_Logo_fondoneutro.png" alt="Alta Studio">
      </div>
    </div>
  </div>
</body>
</html>
