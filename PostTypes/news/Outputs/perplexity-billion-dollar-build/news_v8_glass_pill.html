<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #FFFFFF;
    position: relative;
    background: #0A0A0A;
  }

  .photo-bg {
    position: absolute;
    top: 0; left: 0;
    width: 1080px; height: 1350px;
    object-fit: cover;
    object-position: center 15%;
    z-index: 0;
  }

  .overlay {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.05) 25%,
      rgba(0,0,0,0.45) 58%, rgba(0,0,0,0.88) 100%);
    z-index: 1;
  }
  .vignette {
    position: absolute; top: 0; left: 0;
    width: 1080px; height: 1350px;
    background: radial-gradient(ellipse 75% 70% at 35% 35%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%);
    z-index: 1;
  }

  .content {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 55px 60px 55px;
  }

  .top-bar {
    display: flex; align-items: center;
    justify-content: space-between; width: 100%;
  }
  .left-badges {
    display: flex; align-items: center; gap: 14px;
  }
  .badge {
    background: #E85D3C; color: #FFFFFF;
    font-size: 18px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.12em;
    padding: 10px 22px; border-radius: 8px;
  }
  .brand-pill {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 8px 20px 8px 10px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .brand-pill .logo-wrap {
    width: 32px; height: 32px;
    border-radius: 50%;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  .brand-pill .logo-wrap img {
    width: 32px; height: 32px;
    object-fit: cover;
  }
  .brand-pill span {
    font-size: 17px; font-weight: 600;
    color: rgba(255,255,255,0.9);
  }
  .username {
    font-size: 22px; font-weight: 500;
    color: rgba(255,255,255,0.6);
  }

  .bottom-block {
    display: flex; flex-direction: column; gap: 18px;
  }
  .headline {
    font-size: 57px; font-weight: 800;
    line-height: 1.18; letter-spacing: -0.02em;
    max-width: 940px;
  }
  .accent-coral { color: #E85D3C; }
  .source {
    font-size: 18px; font-weight: 500;
    color: rgba(255,255,255,0.4);
  }
  .bottom-bar {
    display: flex; justify-content: flex-end;
    align-items: center; margin-top: 10px;
  }
  .watermark {
    width: 40px; height: auto;
    opacity: 0.4;
    filter: brightness(3) grayscale(0.3);
  }
</style>
</head>
<body>
  <img class="photo-bg" src="../../../../Assets/Personas/aravind_srinivas_perplexity_02.webp" alt="">
  <div class="overlay"></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="top-bar">
      <div class="left-badges">
        <div class="badge">AI News</div>
        <div class="brand-pill">
          <div class="logo-wrap">
            <img src="../../../../Logos/Perplexity_logo.avif" alt="">
          </div>
          <span>Perplexity</span>
        </div>
      </div>
      <div class="username">@lucianomusellaa</div>
    </div>

    <div class="bottom-block">
      <h1 class="headline">
        Perplexity ofrece <span class="accent-coral">$1M</span> a quien construya un unicornio en 8 semanas
      </h1>
      <div class="source">Fuente: Superhuman AI</div>
      <div class="bottom-bar">
        <img class="watermark" src="../../../../Logos/Alta_Studio_Logo_fondoneutro.png" alt="Alta Studio">
      </div>
    </div>
  </div>
</body>
</html>
