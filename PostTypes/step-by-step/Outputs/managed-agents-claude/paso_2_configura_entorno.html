<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: #F5F2ED;
    background-image:
      linear-gradient(#E8E4DD 1px, transparent 1px),
      linear-gradient(90deg, #E8E4DD 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #0E0E0E;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 80px 80px 90px;
    position: relative;
  }
  .username { font-size: 26px; font-weight: 500; color: #8A8780; }
  .center-block {
    display: flex; flex-direction: column; align-items: center;
    gap: 40px; flex: 1; justify-content: center; width: 100%;
  }
  .text-stack { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .step-label {
    font-size: 24px; font-weight: 600; color: #8A8780;
    text-transform: uppercase; letter-spacing: 0.18em;
  }
  .headline {
    font-size: 56px; font-weight: 800; line-height: 1.18;
    text-align: center; max-width: 880px; letter-spacing: -0.02em;
  }
  .accent-coral { color: #E85D3C; }
  .subtitle {
    font-size: 28px; font-weight: 500; color: #3A3A38;
    line-height: 1.45; text-align: center; max-width: 800px;
    margin-top: 8px;
  }
  .mockup {
    background: #FFFFFF;
    border-radius: 22px;
    box-shadow:
      0 12px 40px rgba(14,14,14,0.08),
      0 30px 80px rgba(14,14,14,0.05);
    width: 700px;
    padding: 36px 40px;
    display: flex; flex-direction: column; gap: 24px;
  }
  .setting-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #F0EDE8;
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-left { display: flex; flex-direction: column; gap: 4px; }
  .setting-name { font-size: 20px; font-weight: 700; color: #0E0E0E; }
  .setting-desc { font-size: 16px; font-weight: 500; color: #8A8780; }
  .setting-value {
    font-size: 18px; font-weight: 600; color: #0E0E0E;
    background: #F5F2ED; padding: 10px 18px; border-radius: 10px;
  }
  .toggle {
    width: 52px; height: 30px; border-radius: 15px;
    background: #E85D3C; position: relative;
  }
  .toggle::after {
    content: ''; width: 24px; height: 24px; border-radius: 50%;
    background: #FFFFFF; position: absolute; right: 3px; top: 3px;
  }
  .toggle.off { background: #D5D0C8; }
  .toggle.off::after { left: 3px; right: auto; }
  .pkg-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .pkg-tag {
    background: #F5F2ED; border-radius: 8px; padding: 8px 16px;
    font-size: 16px; font-weight: 600; color: #0E0E0E;
  }
  .pkg-tag.active {
    background: #FFE45C;
  }
  .mockup-header {
    font-size: 16px; font-weight: 600; color: #8A8780;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding-bottom: 8px; border-bottom: 1.5px solid #F0EDE8;
  }
  .footer { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .indicator { display: flex; gap: 12px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #D5D0C8; }
  .dot.active { width: 13px; height: 13px; background: #E85D3C; }
  .swipe { font-size: 26px; font-weight: 700; }
  .chev {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 4px 12px rgba(14,14,14,0.08);
    display: flex; align-items: center; justify-content: center;
    color: #1A1A1A; font-size: 26px; font-weight: 400;
  }
  .chev.left { left: 30px; }
  .chev.right { right: 30px; }
</style>
</head>
<body>
  <div class="username">@lucianomusellaa</div>

  <div class="center-block">
    <div class="text-stack">
      <div class="step-label">Paso 2</div>
      <h1 class="headline">
        Configura el <span class="accent-coral">entorno</span><br>de ejecución
      </h1>
      <p class="subtitle">Un contenedor cloud con paquetes, acceso a red y archivos preinstalados.</p>
    </div>

    <div class="mockup">
      <div class="mockup-header">Environment settings</div>
      <div class="setting-row">
        <div class="setting-left">
          <div class="setting-name">Nombre</div>
        </div>
        <div class="setting-value">quickstart-env</div>
      </div>
      <div class="setting-row">
        <div class="setting-left">
          <div class="setting-name">Networking</div>
          <div class="setting-desc">Acceso a internet</div>
        </div>
        <div class="toggle"></div>
      </div>
      <div class="setting-row" style="flex-direction: column; align-items: flex-start; gap: 12px;">
        <div class="setting-name">Paquetes</div>
        <div class="pkg-row">
          <div class="pkg-tag active">Python</div>
          <div class="pkg-tag active">Node.js</div>
          <div class="pkg-tag">Go</div>
          <div class="pkg-tag">Ruby</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="indicator">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="swipe">Desliza →</div>
  </div>

  <div class="chev left">‹</div>
  <div class="chev right">›</div>
</body>
</html>
