<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: #17140F;
    background-image:
      linear-gradient(#26221C 1px, transparent 1px),
      linear-gradient(90deg, #26221C 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #F5F2ED;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 80px 80px 90px;
    position: relative;
  }
  .username { font-size: 26px; font-weight: 500; color: #9F9C94; }
  .center-block {
    display: flex; flex-direction: column; align-items: center;
    gap: 40px; flex: 1; justify-content: center; width: 100%;
  }
  .text-stack { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .step-label {
    font-size: 24px; font-weight: 600; color: #9F9C94;
    text-transform: uppercase; letter-spacing: 0.18em;
  }
  .headline {
    font-size: 52px; font-weight: 800; line-height: 1.18;
    text-align: center; max-width: 880px; letter-spacing: -0.02em;
  }
  .accent-coral { color: #E85D3C; }
  .mockup {
    background: #0E0C09;
    border-radius: 22px;
    border: 1px solid rgba(232,93,60,0.15);
    width: 720px;
    padding: 36px 40px;
    display: flex; flex-direction: column; gap: 0;
    font-family: 'JetBrains Mono', monospace;
  }
  .terminal-header {
    display: flex; gap: 8px; margin-bottom: 24px;
  }
  .terminal-dot {
    width: 14px; height: 14px; border-radius: 50%;
  }
  .terminal-dot.red { background: #E85D3C; }
  .terminal-dot.yellow { background: #FFE45C; }
  .terminal-dot.green { background: #4ADE80; }
  .chat-line {
    padding: 10px 0;
    font-size: 18px; line-height: 1.5;
  }
  .chat-user {
    color: #E85D3C; font-weight: 500;
  }
  .chat-user span { color: #C8C5BD; font-weight: 400; }
  .chat-tool {
    color: #FFE45C; font-weight: 500;
  }
  .chat-agent {
    color: #C8C5BD; font-weight: 400;
  }
  .chat-success {
    color: #7FD17F; font-weight: 500;
  }
  .chat-divider {
    height: 1px; background: #332F28; margin: 6px 0;
  }
  .footer { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .indicator { display: flex; gap: 12px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #3F3B34; }
  .dot.active { width: 13px; height: 13px; background: #E85D3C; }
  .swipe { font-size: 26px; font-weight: 700; }
  .chev {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: #252220;
    border: 1px solid rgba(245,242,237,0.08);
    display: flex; align-items: center; justify-content: center;
    color: #F5F2ED; font-size: 26px; font-weight: 400;
  }
  .chev.left { left: 30px; }
  .chev.right { right: 30px; }
</style>
</head>
<body>
  <div class="username">@lucianomusellaa</div>

  <div class="center-block">
    <div class="text-stack">
      <div class="step-label">Paso 4</div>
      <h1 class="headline">
        Envía tareas y recibe<br><span class="accent-coral">resultados</span> en tiempo real
      </h1>
    </div>

    <div class="mockup">
      <div class="terminal-header">
        <div class="terminal-dot red"></div>
        <div class="terminal-dot yellow"></div>
        <div class="terminal-dot green"></div>
      </div>
      <div class="chat-line chat-user">
        tú: <span>Crea un script de Fibonacci<br>y guárdalo en fibonacci.txt</span>
      </div>
      <div class="chat-divider"></div>
      <div class="chat-line chat-agent">
        Voy a crear el script...
      </div>
      <div class="chat-line chat-tool">
        [Usando herramienta: write]
      </div>
      <div class="chat-line chat-tool">
        [Usando herramienta: bash]
      </div>
      <div class="chat-divider"></div>
      <div class="chat-line chat-agent">
        Script ejecutado correctamente.
      </div>
      <div class="chat-line chat-success">
        ✓ fibonacci.txt creado
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="indicator">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
    </div>
    <div class="swipe">Desliza →</div>
  </div>

  <div class="chev left">‹</div>
  <div class="chev right">›</div>
</body>
</html>
