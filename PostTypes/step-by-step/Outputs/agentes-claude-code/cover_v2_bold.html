<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cover v2 — Bold</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: #F5F2ED;
    background-image:
      linear-gradient(#E8E4DD 1px, transparent 1px),
      linear-gradient(90deg, #E8E4DD 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #0E0E0E;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 80px 80px 90px;
  }
  .username { font-size: 26px; font-weight: 500; color: #8A8780; }
  .center-block {
    display: flex; flex-direction: column; align-items: center;
    gap: 60px; flex: 1; justify-content: center; width: 100%;
  }
  .pre-headline {
    font-size: 28px; font-weight: 600; color: #8A8780;
    text-transform: uppercase; letter-spacing: 0.18em;
  }
  .headline {
    font-size: 92px; font-weight: 900; line-height: 1.05;
    text-align: center; max-width: 940px; letter-spacing: -0.035em;
  }
  .accent-coral { color: #E85D3C; }
  .accent-yellow {
    background: #FFE45C; padding: 6px 20px; border-radius: 12px;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
    display: inline-block; line-height: 1.05;
  }
  .swipe { font-size: 26px; font-weight: 700; }

  .terminal {
    width: 480px;
    background: #1A1A1A;
    border-radius: 14px;
    box-shadow:
      0 14px 40px rgba(14,14,14,0.18),
      0 30px 80px rgba(14,14,14,0.08);
    overflow: hidden;
  }
  .terminal-header {
    background: #2A2A2A; height: 32px;
    display: flex; align-items: center; padding: 0 14px; gap: 7px;
  }
  .terminal-dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot-red { background: #FF5F57; }
  .dot-yellow-d { background: #FEBC2E; }
  .dot-green { background: #28C840; }
  .terminal-body {
    padding: 18px 22px;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 19px; color: #F5F2ED; line-height: 1.6;
  }
  .prompt { color: #E85D3C; font-weight: 600; }
</style>
</head>
<body>
  <div class="username">@lucianomusellaa</div>
  <div class="center-block">
    <div class="pre-headline">Tutorial · 4 pasos</div>
    <h1 class="headline">
      Construí un<br>
      <span class="accent-coral">agente</span> de IA<br>
      con <span class="accent-yellow">Claude Code</span>
    </h1>
    <div class="terminal">
      <div class="terminal-header">
        <div class="terminal-dot dot-red"></div>
        <div class="terminal-dot dot-yellow-d"></div>
        <div class="terminal-dot dot-green"></div>
      </div>
      <div class="terminal-body">
        <div><span class="prompt">$</span> npm i -g @anthropic-ai/claude-code</div>
      </div>
    </div>
  </div>
  <div class="swipe">Deslizá →</div>
</body>
</html>
