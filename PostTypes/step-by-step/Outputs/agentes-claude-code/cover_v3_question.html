<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cover v3 — Question</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: #F5F2ED;
    background-image:
      linear-gradient(#E8E4DD 1px, transparent 1px),
      linear-gradient(90deg, #E8E4DD 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #0E0E0E;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 80px 80px 90px;
  }
  .username { font-size: 26px; font-weight: 500; color: #8A8780; }
  .center-block {
    display: flex; flex-direction: column; align-items: center;
    gap: 80px; flex: 1; justify-content: center; width: 100%;
  }
  .headline {
    font-size: 70px; font-weight: 800; line-height: 1.18;
    text-align: center; max-width: 940px; letter-spacing: -0.022em;
  }
  .accent-coral { color: #E85D3C; }
  .accent-yellow {
    background: #FFE45C; padding: 4px 18px; border-radius: 10px;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
    display: inline-block; line-height: 1.08;
  }
  .swipe { font-size: 26px; font-weight: 700; }

  /* Floating mini-cards as conceptual visual */
  .agent-cluster {
    position: relative;
    width: 560px; height: 220px;
    display: flex; align-items: center; justify-content: center;
  }
  .agent-node {
    position: absolute;
    width: 100px; height: 100px;
    background: #FFFFFF;
    border-radius: 50%;
    box-shadow: 0 12px 30px rgba(14,14,14,0.10);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px; font-weight: 600;
    color: #1A1A1A;
  }
  .agent-node.main {
    width: 140px; height: 140px;
    background: #E85D3C;
    color: #FFFFFF;
    font-size: 44px;
    z-index: 3;
    box-shadow: 0 16px 40px rgba(232,93,60,0.30);
  }
  .agent-node.sub-1 { left: 20px; top: 20px; }
  .agent-node.sub-2 { right: 20px; top: 20px; }
  .agent-node.sub-3 { left: 80px; bottom: 0; }
  .agent-node.sub-4 { right: 80px; bottom: 0; }
  .line {
    position: absolute;
    height: 2px;
    background: #1A1A1A;
    transform-origin: left center;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="username">@lucianomusellaa</div>
  <div class="center-block">
    <h1 class="headline">
      ¿Cómo crear un<br>
      <span class="accent-coral">agente de IA</span> con<br>
      <span class="accent-yellow">Claude Code</span>?
    </h1>
    <div class="agent-cluster">
      <svg width="560" height="220" style="position:absolute; top:0; left:0; z-index:1;">
        <line x1="280" y1="110" x2="70" y2="70" stroke="#1A1A1A" stroke-width="2"/>
        <line x1="280" y1="110" x2="490" y2="70" stroke="#1A1A1A" stroke-width="2"/>
        <line x1="280" y1="110" x2="130" y2="170" stroke="#1A1A1A" stroke-width="2"/>
        <line x1="280" y1="110" x2="430" y2="170" stroke="#1A1A1A" stroke-width="2"/>
      </svg>
      <div class="agent-node sub-1">{ }</div>
      <div class="agent-node sub-2">{ }</div>
      <div class="agent-node sub-3">{ }</div>
      <div class="agent-node sub-4">{ }</div>
      <div class="agent-node main">▲</div>
    </div>
  </div>
  <div class="swipe">Deslizá →</div>
</body>
</html>
