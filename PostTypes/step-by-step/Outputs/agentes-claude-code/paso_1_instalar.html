<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Paso 1 — Instalar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: #F5F2ED;
    background-image:
      linear-gradient(#E8E4DD 1px, transparent 1px),
      linear-gradient(90deg, #E8E4DD 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #0E0E0E;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 80px 80px 90px;
    position: relative;
  }
  .username { font-size: 26px; font-weight: 500; color: #8A8780; }
  .center-block {
    display: flex; flex-direction: column; align-items: center;
    gap: 50px; flex: 1; justify-content: center; width: 100%;
  }
  .text-stack { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .step-label {
    font-size: 24px; font-weight: 600; color: #8A8780;
    text-transform: uppercase; letter-spacing: 0.18em;
  }
  .headline {
    font-size: 58px; font-weight: 800; line-height: 1.18;
    text-align: center; max-width: 880px; letter-spacing: -0.02em;
  }
  .accent-coral { color: #E85D3C; }
  .accent-yellow {
    background: #FFE45C; padding: 4px 14px; border-radius: 8px;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
    display: inline-block; line-height: 1.05;
  }
  .swipe { font-size: 26px; font-weight: 700; }
  .footer { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .indicator { display: flex; gap: 12px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #D5D0C8; }
  .dot.active { width: 13px; height: 13px; background: #E85D3C; }

  .terminal {
    width: 760px;
    background: #1A1A1A;
    border-radius: 18px;
    box-shadow:
      0 14px 40px rgba(14,14,14,0.18),
      0 30px 80px rgba(14,14,14,0.10);
    overflow: hidden;
  }
  .terminal-header {
    background: #2A2A2A; height: 42px;
    display: flex; align-items: center; padding: 0 18px; gap: 9px;
  }
  .terminal-dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot-red { background: #FF5F57; }
  .dot-yellow-d { background: #FEBC2E; }
  .dot-green { background: #28C840; }
  .terminal-title {
    flex: 1; text-align: center;
    color: #8A8780; font-family: 'JetBrains Mono', monospace;
    font-size: 14px; font-weight: 500;
    margin-right: 60px;
  }
  .terminal-body {
    padding: 30px 36px;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 23px; color: #F5F2ED; line-height: 1.8;
  }
  .prompt { color: #E85D3C; font-weight: 600; }
  .comment { color: #6B6B6B; font-style: italic; }

  .chev {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 4px 12px rgba(14,14,14,0.08);
    display: flex; align-items: center; justify-content: center;
    color: #1A1A1A; font-size: 28px; font-weight: 400;
    line-height: 1;
  }
  .chev.left { left: 30px; }
  .chev.right { right: 30px; }
</style>
</head>
<body>
  <div class="username">@lucianomusellaa</div>

  <div class="center-block">
    <div class="text-stack">
      <div class="step-label">Paso 1</div>
      <h1 class="headline">Instala Claude Code<br>en tu <span class="accent-coral">terminal</span></h1>
    </div>

    <div class="terminal">
      <div class="terminal-header">
        <div class="terminal-dot dot-red"></div>
        <div class="terminal-dot dot-yellow-d"></div>
        <div class="terminal-dot dot-green"></div>
        <div class="terminal-title">~/mi-agente — bash</div>
      </div>
      <div class="terminal-body">
        <div><span class="comment"># instálalo globalmente con npm</span></div>
        <div><span class="prompt">$</span> npm install -g @anthropic-ai/claude-code</div>
        <div>&nbsp;</div>
        <div><span class="comment"># entra a tu proyecto y arráncalo</span></div>
        <div><span class="prompt">$</span> cd mi-agente</div>
        <div><span class="prompt">$</span> claude</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="indicator">
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="swipe">Desliza →</div>
  </div>

  <div class="chev left">‹</div>
  <div class="chev right">›</div>
</body>
</html>
