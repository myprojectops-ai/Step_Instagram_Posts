<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>V3 Short Punchy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: #F5F2ED;
    background-image:
      linear-gradient(#E8E4DD 1px, transparent 1px),
      linear-gradient(90deg, #E8E4DD 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #0E0E0E;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 80px 80px 90px;
  }
  .username { font-size: 26px; font-weight: 500; color: #8A8780; }
  .center-block { display: flex; flex-direction: column; align-items: center; gap: 110px; flex: 1; justify-content: center; width: 100%; }
  .headline { font-size: 76px; font-weight: 800; line-height: 1.1; text-align: center; max-width: 920px; letter-spacing: -0.025em; }
  .accent-coral { color: #E85D3C; }
  .swipe { font-size: 26px; font-weight: 700; }
  .logo-row { display: flex; align-items: center; gap: 0; }
  .logo-bubble { width: 180px; height: 180px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo-bubble.white { background: #FFFFFF; box-shadow: 0 14px 40px rgba(14,14,14,0.10); }
  .logo-bubble.coral { background: #E85D3C; }
  .logo-m { font-weight: 900; font-size: 120px; color: #1A1A1A; letter-spacing: -0.08em; line-height: 1; margin-top: -10px; }
  .connector { width: 120px; height: 2.5px; background: #1A1A1A; position: relative; flex-shrink: 0; }
  .link-icon { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 2px solid #1A1A1A; display: flex; align-items: center; justify-content: center; }
  .sparkle { width: 110px; height: 110px; }
</style>
</head>
<body>
  <div class="username">@ramiro.cubria</div>
  <div class="center-block">
    <h1 class="headline">Agendá llamadas con<br><span class="accent-coral">Claude</span> + ManyChat</h1>
    <div class="logo-row">
      <div class="logo-bubble white"><div class="logo-m">m</div></div>
      <div class="connector">
        <div class="link-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/>
            <path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/>
          </svg>
        </div>
      </div>
      <div class="logo-bubble coral">
        <svg class="sparkle" viewBox="0 0 100 100" fill="white">
          <rect x="47" y="4" width="6" height="92" rx="3"/>
          <rect x="47" y="4" width="6" height="92" rx="3" transform="rotate(45 50 50)"/>
          <rect x="47" y="4" width="6" height="92" rx="3" transform="rotate(90 50 50)"/>
          <rect x="47" y="4" width="6" height="92" rx="3" transform="rotate(135 50 50)"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="swipe">Deslizá →</div>
</body>
</html>
