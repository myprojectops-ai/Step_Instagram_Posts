<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Paso 4 — Subagentes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: #F5F2ED;
    background-image:
      linear-gradient(#E8E4DD 1px, transparent 1px),
      linear-gradient(90deg, #E8E4DD 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #0E0E0E;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 80px 80px 90px;
    position: relative;
  }
  .username { font-size: 26px; font-weight: 500; color: #8A8780; }
  .center-block {
    display: flex; flex-direction: column; align-items: center;
    gap: 32px; flex: 1; justify-content: center; width: 100%;
  }
  .text-stack { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .step-label {
    font-size: 24px; font-weight: 600; color: #8A8780;
    text-transform: uppercase; letter-spacing: 0.18em;
  }
  .headline {
    font-size: 56px; font-weight: 800; line-height: 1.18;
    text-align: center; max-width: 880px; letter-spacing: -0.02em;
  }
  .accent-coral { color: #E85D3C; }
  .subtitle {
    font-size: 23px; font-weight: 500; color: #3A3A38;
    line-height: 1.45; text-align: center; max-width: 760px;
  }
  .swipe { font-size: 26px; font-weight: 700; }
  .footer { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .indicator { display: flex; gap: 12px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #D5D0C8; }
  .dot.active { width: 13px; height: 13px; background: #E85D3C; }

  .diagram-svg {
    display: block;
    filter: drop-shadow(0 14px 40px rgba(14,14,14,0.08));
  }

  .chev {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 4px 12px rgba(14,14,14,0.08);
    display: flex; align-items: center; justify-content: center;
    color: #1A1A1A; font-size: 28px; font-weight: 400; line-height: 1;
  }
  .chev.left { left: 30px; }
  .chev.right { right: 30px; }
</style>
</head>
<body>
  <div class="username">@lucianomusellaa</div>

  <div class="center-block">
    <div class="text-stack">
      <div class="step-label">Paso 4</div>
      <h1 class="headline">Delega tareas pesadas<br>a <span class="accent-coral">Subagentes</span></h1>
      <p class="subtitle">Para tareas grandes (auditar 200 páginas, investigar 50 competidores) el agente principal delega a subagentes que trabajan en paralelo.</p>
    </div>

    <svg class="diagram-svg" width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
        </marker>
      </defs>

      <!-- Curved connector lines from main agent down to task cards -->
      <path d="M 450 160 C 450 240, 170 240, 170 320" stroke="#1A1A1A" stroke-width="2.5" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow)"/>
      <path d="M 450 160 C 450 240, 450 240, 450 320" stroke="#1A1A1A" stroke-width="2.5" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow)"/>
      <path d="M 450 160 C 450 240, 730 240, 730 320" stroke="#1A1A1A" stroke-width="2.5" stroke-dasharray="6 6" fill="none" marker-end="url(#arrow)"/>

      <!-- Main agent - large rounded rectangle (more editorial than circle) -->
      <rect x="320" y="40" width="260" height="120" rx="22" fill="#E85D3C"/>
      <text x="450" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FFE0D6" letter-spacing="2.5">AGENTE PRINCIPAL</text>
      <text x="450" y="124" text-anchor="middle" font-family="Inter, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">orquestador</text>

      <!-- Task card 1 - Investigar -->
      <rect x="40" y="320" width="260" height="150" rx="20" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
      <line x1="40" y1="358" x2="300" y2="358" stroke="#1A1A1A" stroke-width="2"/>
      <text x="60" y="346" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#E85D3C">› subagente_01</text>
      <circle cx="280" cy="340" r="4" fill="#28C840"/>
      <text x="170" y="395" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="800" fill="#1A1A1A">investiga</text>
      <text x="170" y="425" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#8A8780">top 10 de Google</text>
      <text x="170" y="448" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#8A8780">para tu keyword</text>

      <!-- Task card 2 - Auditar -->
      <rect x="320" y="320" width="260" height="150" rx="20" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
      <line x1="320" y1="358" x2="580" y2="358" stroke="#1A1A1A" stroke-width="2"/>
      <text x="340" y="346" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#E85D3C">› subagente_02</text>
      <circle cx="560" cy="340" r="4" fill="#28C840"/>
      <text x="450" y="395" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="800" fill="#1A1A1A">audita</text>
      <text x="450" y="425" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#8A8780">200 páginas en</text>
      <text x="450" y="448" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#8A8780">paralelo</text>

      <!-- Task card 3 - Redactar -->
      <rect x="600" y="320" width="260" height="150" rx="20" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
      <line x1="600" y1="358" x2="860" y2="358" stroke="#1A1A1A" stroke-width="2"/>
      <text x="620" y="346" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#E85D3C">› subagente_03</text>
      <circle cx="840" cy="340" r="4" fill="#28C840"/>
      <text x="730" y="395" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="800" fill="#1A1A1A">redacta</text>
      <text x="730" y="425" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#8A8780">briefs y artículos</text>
      <text x="730" y="448" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#8A8780">optimizados</text>
    </svg>
  </div>

  <div class="footer">
    <div class="indicator">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
    </div>
    <div class="swipe">Desliza →</div>
  </div>

  <div class="chev left">‹</div>
  <div class="chev right">›</div>
</body>
</html>
