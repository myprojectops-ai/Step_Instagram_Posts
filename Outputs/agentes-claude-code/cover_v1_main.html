<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cover v1 — Main</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: #F5F2ED;
    background-image:
      linear-gradient(#E8E4DD 1px, transparent 1px),
      linear-gradient(90deg, #E8E4DD 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #0E0E0E;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 80px 80px 90px;
  }
  .username { font-size: 26px; font-weight: 500; color: #8A8780; }
  .center-block {
    display: flex; flex-direction: column; align-items: center;
    gap: 70px; flex: 1; justify-content: center; width: 100%;
  }
  .headline {
    font-size: 78px; font-weight: 800; line-height: 1.12;
    text-align: center; max-width: 940px; letter-spacing: -0.025em;
  }
  .accent-coral { color: #E85D3C; }
  .accent-yellow {
    background: #FFE45C; padding: 4px 18px; border-radius: 10px;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
    display: inline-block; line-height: 1.08;
  }
  .swipe { font-size: 26px; font-weight: 700; }
  .footer { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .indicator { display: flex; gap: 12px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #D5D0C8; }
  .dot.active { width: 13px; height: 13px; background: #E85D3C; }

  .terminal {
    width: 560px;
    background: #1A1A1A;
    border-radius: 16px;
    box-shadow:
      0 14px 40px rgba(14,14,14,0.18),
      0 30px 80px rgba(14,14,14,0.08);
    overflow: hidden;
  }
  .terminal-header {
    background: #2A2A2A;
    height: 36px;
    display: flex; align-items: center; padding: 0 16px;
    gap: 8px;
  }
  .terminal-dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-red { background: #FF5F57; }
  .dot-yellow { background: #FEBC2E; }
  .dot-green { background: #28C840; }
  .terminal-body {
    padding: 22px 26px;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 22px;
    color: #F5F2ED;
    line-height: 1.6;
  }
  .prompt { color: #E85D3C; font-weight: 600; }
  .cmd { color: #F5F2ED; }
  .cursor {
    display: inline-block;
    width: 12px; height: 22px;
    background: #FFE45C;
    vertical-align: middle;
    margin-left: 4px;
    margin-bottom: 2px;
  }
</style>
</head>
<body>
  <div class="username">@lucianomusellaa</div>
  <div class="center-block">
    <h1 class="headline">
      Crea tu propio<br>
      agente de IA con<br>
      <span class="accent-coral">Claude Code</span> en
      <span class="accent-yellow">4 pasos</span>
    </h1>
    <div class="terminal">
      <div class="terminal-header">
        <div class="terminal-dot dot-red"></div>
        <div class="terminal-dot dot-yellow"></div>
        <div class="terminal-dot dot-green"></div>
      </div>
      <div class="terminal-body">
        <div><span class="prompt">~/mi-agente</span> <span class="cmd">$ claude</span><span class="cursor"></span></div>
      </div>
    </div>
  </div>
  <div class="footer">
    <div class="indicator">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="swipe">Desliza →</div>
  </div>
</body>
</html>
